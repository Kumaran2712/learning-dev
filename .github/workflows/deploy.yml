name: Deploy

on:
  push:
    branches: [dev, stage, prod]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'production' || github.ref_name == 'stage' && 'staging' || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: echo "🚀 Deploying ${{ github.sha }} from ${{ github.ref_name }}"
      - run: node hello.js